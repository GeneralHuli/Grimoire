services:
  server:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ../server:/app/server
      - server_node_modules:/app/server/node_modules
      - grimoire_data:/app/server/data
    environment:
      - PORT=3000
      - GRIMOIRE_ENCRYPTION_KEY=${GRIMOIRE_ENCRYPTION_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ../web:/app/web
      - web_node_modules:/app/web/node_modules
    depends_on:
      - server

volumes:
  server_node_modules:
  web_node_modules:
  grimoire_data:
